<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión – SalesApp</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; align-items: center; }
    .login-card { border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
    .login-card .card-header { background: #1a1a2e; border-radius: 16px 16px 0 0; }
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card login-card border-0">
        <div class="card-header text-center py-4">
          <h4 class="text-white mb-0"><i class="bi bi-shop"></i> SalesApp</h4>
          <small class="text-muted">Sistema de Ventas e Inventario</small>
        </div>
        <div class="card-body p-4">
          <h5 class="mb-4">Iniciar Sesión</h5>
          {% if form.errors %}
            <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
          {% endif %}
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">{{ form.username.label }}</label>
              {{ form.username }}
            </div>
            <div class="mb-3">
              <label class="form-label">{{ form.password.label }}</label>
              {{ form.password }}
            </div>
            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-box-arrow-in-right"></i> Entrar
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
