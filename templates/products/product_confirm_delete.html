{% extends 'base.html' %}
{% block title %}Eliminar Producto – SalesApp{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width:480px;margin-top:80px">
  <div class="card-body text-center p-5">
    <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:3rem"></i>
    <h5 class="mt-3">¿Eliminar <strong>{{ object }}</strong>?</h5>
    <p class="text-muted">Esta acción no se puede deshacer.</p>
    <form method="post" class="d-flex justify-content-center gap-3 mt-4">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Sí, eliminar</button>
      <a href="{% url 'product_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
