{% extends 'base.html' %}
{% block title %}{{ title }} – SalesApp{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h4><i class="bi bi-tags"></i> {{ title }}</h4>
  <a href="{% url 'category_list' %}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left"></i> Volver
  </a>
</div>
<div class="card">
  <div class="card-body p-4" style="max-width:500px">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div class="text-danger small">{{ field.errors.0 }}</div>{% endif %}
      </div>
      {% endfor %}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Guardar</button>
        <a href="{% url 'category_list' %}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
