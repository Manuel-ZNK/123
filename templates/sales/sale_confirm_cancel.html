{% extends 'base.html' %}
{% block title %}Cancelar Venta – SalesApp{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width:480px;margin-top:80px">
  <div class="card-body text-center p-5">
    <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:3rem"></i>
    <h5 class="mt-3">¿Cancelar <strong>Venta #{{ sale.pk }}</strong>?</h5>
    <p class="text-muted">Se restaurará el stock de todos los productos de esta venta.</p>
    <form method="post" class="d-flex justify-content-center gap-3 mt-4">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Sí, cancelar venta</button>
      <a href="{% url 'sale_detail' sale.pk %}" class="btn btn-secondary">No, volver</a>
    </form>
  </div>
</div>
{% endblock %}
